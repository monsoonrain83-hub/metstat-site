{
  "name": "metstat-deploy-site",
  "on": {
    "push": {
      "branches": ["main"],
      "paths": [
        "site_src.zip",
        "site_src.part*",
        "site_patch*.zip",
        "nwp_upload.php"
      ]
    },
    "workflow_dispatch": {}
  },
  "concurrency": {
    "group": "deploy",
    "cancel-in-progress": true
  },
  "jobs": {
    "deploy": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "20"
          }
        },
        {
          "name": "unzip + build",
          "run": "if ls site_src.part* >/dev/null 2>&1; then cat site_src.part* > site_src_joined.zip; else cp site_src.zip site_src_joined.zip; fi && mkdir work && unzip -q site_src_joined.zip -d work && P=$(ls site_patch*.zip 2>/dev/null | sort -V | tail -1) && if [ -n \"$P\" ]; then unzip -oq \"$P\" -d work; echo \"patch applied: $P\"; else echo \"no patch\"; fi && cd work/site && python3 build_site.py index.html && ls -la index.html && cat version.json"
        },
        {
          "name": "smoke test (browser)",
          "run": "cd work/site/tests && npm init -y >/dev/null && npm i playwright@1.47.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null && node smoke.js ../index.html"
        },
        {
          "name": "prepare files",
          "run": "mkdir -p dist/online && cp work/site/index.html dist/index.html && cp work/site/version.json dist/version.json && if [ -f nwp_upload.php ]; then cp nwp_upload.php dist/online/nwp_upload.php; else echo \"nwp_upload.php \u062f\u0631 \u0645\u062e\u0632\u0646 \u0646\u06cc\u0633\u062a\u061b \u0641\u0642\u0637 index.html \u062f\u06cc\u067e\u0644\u0648\u06cc \u0645\u06cc\u200c\u0634\u0648\u062f\"; fi"
        },
        {
          "name": "normalize server dir",
          "id": "dir",
          "env": {
            "D": "${{ secrets.FTP_DIR }}"
          },
          "run": "d=\"${D:-/}\"; case \"$d\" in */) ;; *) d=\"$d/\";; esac; echo \"dir=$d\" >> $GITHUB_OUTPUT; echo \"server-dir = $d\""
        },
        {
          "name": "Validate release hashes before manual FTPS",
          "if": "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.METSTAT_CANONICAL_RELEASE_VALIDATED == 'yes' }}",
          "run": "python3 tools/metstat_release_preflight.py --root dist --manifest releases/MetStat_r121_RELEASE_MANIFEST.json --phase release"
        },
        {
          "name": "upload to host (FTPS)",
          "if": "${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.METSTAT_CANONICAL_RELEASE_VALIDATED == 'yes' }}",
          "uses": "SamKirkland/FTP-Deploy-Action@v4.3.5",
          "with": {
            "server": "${{ secrets.FTP_SERVER }}",
            "username": "${{ secrets.FTP_USERNAME }}",
            "password": "${{ secrets.FTP_PASSWORD }}",
            "protocol": "ftps",
            "local-dir": "./dist/",
            "server-dir": "${{ steps.dir.outputs.dir }}",
            "state-name": ".metstat-deploy-state.json"
          }
        }
      ]
    }
  }
}