name: Legacy site deployment (retired)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse obsolete FTP release
        run: |
          echo "::error::Legacy archive deployment is retired. Reconcile the verified R5 baseline before introducing a new release workflow."
          exit 1
