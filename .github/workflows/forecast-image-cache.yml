name: Forecast image cache unit tests
on:
  pull_request:
    paths:
      - 'web/forecast/image-cache.mjs'
      - 'tests/test-forecast-image-cache.mjs'
      - '.github/workflows/forecast-image-cache.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/test-forecast-image-cache.mjs
