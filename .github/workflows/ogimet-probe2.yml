name: metstat-ogimet-probe2
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas lxml html5lib beautifulsoup4
      - name: probe OGIMET
        run: python ogimet_probe2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ogimet_probe2
          path: |
            ogimet_probe2.txt
            ogimet_sample2.html
