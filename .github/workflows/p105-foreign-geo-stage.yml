name: P1-05 foreign geography staging (no deployment)
on:
  push:
    branches: [audit/host-v119-p0-01-20261127]
    paths: ['.github/workflows/p105-foreign-geo-stage.yml', 'scripts/stage_foreign_geo_p105.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2
      - run: python scripts/stage_foreign_geo_p105.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p105-foreign-geo-staging
          path: geo-stage/
          if-no-files-found: warn
          retention-days: 7
