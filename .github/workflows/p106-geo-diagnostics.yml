name: P1-06 cross-level geography diagnostic
on:
  push:
    branches: [audit/host-v119-p0-01-20261127]
    paths: ['.github/workflows/p106-geo-diagnostics.yml', 'scripts/diagnose_foreign_geo_p106.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2 pyproj==3.7.2
      - run: python scripts/stage_foreign_geo_p105.py
      - run: python scripts/diagnose_foreign_geo_p106.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p106-geography-diagnostics
          path: |
            geo-stage/report.json
            geo-stage/cross-level-report.json
            geo-stage/*/*-diagnostics.json
            geo-stage/*/*.metadata.json
          if-no-files-found: warn
          retention-days: 14
