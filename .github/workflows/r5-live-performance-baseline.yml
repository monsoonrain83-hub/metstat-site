name: Live frontend performance baseline (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/measure-live-performance.cjs'
      - '.github/workflows/r5-live-performance-baseline.yml'
permissions:
  contents: read
concurrency:
  group: metstat-live-performance-baseline
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/measure-live-performance.cjs
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/measure-live-performance.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metstat-live-performance-baseline
          path: metstat-live-performance.json
          retention-days: 14
          if-no-files-found: warn
