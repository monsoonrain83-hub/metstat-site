name: R5 parameter picker ownership tests
on:
  pull_request:
    paths:
      - 'web/forecast/parameter-picker.mjs'
      - 'scripts/test-r5-parameter-picker.cjs'
      - '.github/workflows/r5-parameter-picker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-r5-parameter-picker.cjs
