name: Verify R5 live shell and anonymous authorization gate
on:
  push:
    branches: [audit/r5-v61-integration-20261125]
    paths: [.github/workflows/r5-v61-integration-prerequisites.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read-only shell and unauthorized status checks
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, hashlib,json
          base='https://wtafkik.ir'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          for path in ['/index.html','/monitoring-forecast/station-isohyet','/online/station_isohyet_unified_v62_cartography.html','/online/station_isohyet_unified_v64.html']:
              try:
                  with opener.open(urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','Accept-Encoding':'identity'}),timeout=15) as r:
                      b=r.read(4000000); print(json.dumps({'path':path,'http':r.status,'sha256':hashlib.sha256(b).hexdigest()}))
              except urllib.error.HTTPError as e:print(json.dumps({'path':path,'http':e.code}))
          for action,method in [('me','GET'),('rainfall_admin_v63','POST'),('admin_console','GET')]:
              try:
                  req=urllib.request.Request(base+'/auth.php?a='+action,method=method,data=b'{"action":"admin-status"}' if method=='POST' else None,headers={'X-Requested-With':'MetStat','Content-Type':'application/json','Origin':base,'Cache-Control':'no-store'})
                  try:r=opener.open(req,timeout=15)
                  except urllib.error.HTTPError as e:r=e
                  with r:
                      status=r.status
                      try:d=json.loads(r.read(50000))
                      except Exception:d={}
                      err=d.get('error','')
                      safe=err if err in ['auth','forbidden','unknown_action','csrf','origin','method','server_db','bad_request'] else ('other' if err else '')
                      print(json.dumps({'action':action,'http':status,'error':safe,'guest':('user' in d and d['user'] is None)}))
              except Exception as e:print(json.dumps({'action':action,'failure':type(e).__name__}))
          PY
