name: V97 normalized scan report contract
on:
  pull_request:
    paths:
      - 'scripts/scan_report.py'
      - 'tests/test_scan_report.py'
      - '.github/workflows/scan-report-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_scan_report.py' -v
      - name: Replay two prior public reports without contacting host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/15130134188/zip > previous.zip
          gh api repos/${{ github.repository }}/actions/artifacts/15133401464/zip > current.zip
          echo '7645849f365e8e5aff59aef8089c6a227a5dd2802a768f9176b9ccb3c653d2d7  previous.zip' | sha256sum -c -
          echo 'a4aa021770b840e23fa51a002948f47f17d7595c032bae2fd79f595356275941  current.zip' | sha256sum -c -
          unzip -p previous.zip public-health-report.json > previous.json
          unzip -p current.zip public-health-report.json > current.json
          python scripts/scan_report.py current.json --previous previous.json --output findings
      - uses: actions/upload-artifact@v4
        with:
          name: v97-normalized-findings
          path: findings/
          retention-days: 7
