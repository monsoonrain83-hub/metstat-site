name: scoped-station-search
on:
  push:
    paths:
      - 'station_matching/**'
      - '.github/workflows/scoped-station-search.yml'
      - 'station_matching/metstat_province_selector.js'
      - 'station_matching/metstat_province_selector.test.cjs'
      - 'station_matching/metstat_rainfall_text_parser.js'
      - 'station_matching/metstat_rainfall_text_parser.test.cjs'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          node station_matching/metstat_scoped_station_search.test.cjs
          node station_matching/metstat_province_selector.test.cjs
          node station_matching/metstat_rainfall_text_parser.test.cjs
