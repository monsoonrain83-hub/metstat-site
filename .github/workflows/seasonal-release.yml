name: Deploy verified seasonal viewer
on:
  pull_request:
    paths: ['seasonal_release/**', '.github/workflows/seasonal-release.yml']
  push:
    branches: [main]
    paths: ['seasonal_release/**', '.github/workflows/seasonal-release.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: metstat-seasonal-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch to the verified deployed revision
        run: python seasonal_release/release.py
      - name: Install browser test dependencies
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Test AVA toolbox independently of host state
        run: python seasonal_release/toolbox_smoke.py
      - name: Test patched public route
        run: python seasonal_release/smoke.py
      - name: Deploy only the verified release files
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR }}
        run: python seasonal_release/release.py --deploy
      - name: Keep rollback copy
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: seasonal-r115-rollback
          path: seasonal_release/backup/
          retention-days: 30
