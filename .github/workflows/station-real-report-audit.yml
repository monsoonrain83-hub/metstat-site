name: Station real rainfall report audit (88 lookups)
on:
  workflow_dispatch:
  push:
    branches: [fix/station-coordinate-qc-20261125]
    paths: [.github/workflows/station-real-report-audit.yml]
permissions:
  contents: read
concurrency:
  group: station-real-report-audit
  cancel-in-progress: false
