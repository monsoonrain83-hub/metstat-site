          python3 - <<'PY'
          import json,urllib.request,collections
          from pathlib import Path
          rows=[]
          province=''
          for line in Path('report-input.txt').read_text().splitlines():
              if '|' not in line: province=line;continue
              name,rain=line.split('|')
              rows.append(dict(name=name,province=province,rain=float(rain)))
          assert len(rows)==88
          # Ordinary public lookup only; no emergency geolocation, no submissions.
          url='https://wtafkik.ir/online/rain_station_lookup_v45.php'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          opener=urllib.request.build_opener(NoRedirect())
          def post(obj):
              req=urllib.request.Request(url,data=json.dumps(obj,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','Accept':'application/json','Origin':'https://wtafkik.ir'},method='POST')
              with opener.open(req,timeout=150) as res:
                  return json.loads(res.read(8*1024*1024))
          status=post({'action':'status'})
          assert status.get('ready') is True, 'Operational lookup unavailable'
          payload=post({'queries':[{'name':r['name'],'province':r['province']} for r in rows]})
          result=payload.get('results')
          assert isinstance(result,list) and len(result)==len(rows), 'Unexpected API response shape'
          out=[]
          for row,res in zip(rows,result):
              c=res.get('candidates') or []
              places=res.get('places') or []
              top=c[0] if c else {}
              out.append({**row,'status':res.get('status','unknown'),'reason':res.get('reason',''),'candidate_count':len(c),'reference_count':len(places),'top_name':top.get('fa',''),'top_id':top.get('id',''),'top_province':top.get('ostan',''),'top_score':top.get('score'),'auto_match_allowed':top.get('auto_match_allowed'),'requires_review':top.get('requires_review')})
          summary={'api_version':status.get('version'),'n':len(out),'status_counts':dict(collections.Counter(r['status'] for r in out)),'with_station_candidates':sum(bool(r['candidate_count']) for r in out),'reference_only':sum(not r['candidate_count'] and bool(r['reference_count']) for r in out),'no_station_or_reference':sum(not r['candidate_count'] and not r['reference_count'] for r in out)}
          Path('live-station-report.json').write_text(json.dumps({'summary':summary,'rows':out},ensure_ascii=False,indent=2))
          print(json.dumps(summary,ensure_ascii=False))
          for r in out:
              print(json.dumps(r,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-station-report-88
