name: V87 sidebar structural replacement browser gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/*v87*'
      - 'web/forecast/parameter-picker.mjs'
      - 'web/forecast/sidebar-controls.mjs'
      - '.github/workflows/v87-sidebar-gate.yml'
permissions:
  contents: read
concurrency:
  group: v87-sidebar-gate
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: PYTHONPATH=scripts python3 -m unittest discover -s tests -p 'test_frontend_release.py' -v
      - run: python3 scripts/build-v87-sidebar.py
      - run: find v87-candidate/assets -name '*.js' -exec node --check {} +
      - run: python3 scripts/check_retired_host_files.py v87-candidate
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-r5-parameter-picker.cjs
      - run: node scripts/test-v87-sidebar.cjs
      - run: node scripts/test-v87-browser.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v87-reports
          path: |
            v87-sidebar-report.json
            v87-browser-report.json
          retention-days: 14
          if-no-files-found: warn
      - name: Archive verified candidate
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('v87-candidate')
          with zipfile.ZipFile('MetStat_V87_upload.zip','w',compression=zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file(): z.write(p,p.relative_to(root))
          PY
          python3 scripts/check_retired_host_files.py MetStat_V87_upload.zip
          python3 scripts/verify_frontend_release.py MetStat_V87_upload.zip v87-baseline > v87-release-provenance.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v87-browser-verified-candidate
          path: |
            MetStat_V87_upload.zip
            v87-release-provenance.json
          retention-days: 14
